name: Build LocalReaderMonitor

# Chỉ build thôi — KHÔNG chạy setup.ps1/cài PostgreSQL ở đây. Runner là máy ảo
# cloud, không có đường vào mạng LAN nhà máy; setup.ps1 chỉ chạy tay tại chỗ
# trên máy khách thật (đã thống nhất khi thiết kế quy trình đóng gói).
"on":
  push:
    tags:
      - "v*"
  # `mode: artifact` (mặc định) — chỉ build, upload Actions artifact tạm 7
  # ngày, không đụng GitHub Release. `mode: release` — build + publish GitHub
  # Release thật. Cả 2 cách, tag/version KHÔNG gõ tay: bước "Read APP_VERSION"
  # luôn lấy từ app_info.py (nguồn duy nhất, cùng giá trị app hiển thị trên UI).
  workflow_dispatch:
    inputs:
      mode:
        description: "artifact = build only (temporary 7-day Actions artifact); release = build + publish a real GitHub Release (tag read from app_info.py)"
        required: false
        default: artifact
        type: choice
        options:
          - artifact
          - release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Tag release suy ra từ APP_VERSION trong app_info.py thay vì tin vào tag
      # gõ tay. tag_name chỉ dùng cho workflow_dispatch (tag push dùng chính
      # github.ref_name), nhưng notice/summary chạy cho mọi trigger để thấy
      # version sắp release trước khi build bắt đầu.
      - name: Read APP_VERSION from app_info.py
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "from app_info import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT

          $mode = "${{ github.event.inputs.mode }}"
          if ([string]::IsNullOrEmpty($mode)) { $mode = "(tag push, not applicable)" }
          Write-Output "::notice title=Release version::APP_VERSION=$version -> tag $tag (trigger: ${{ github.event_name }}, mode: $mode)"

          $summaryLines = @(
            "### Release version",
            "- **APP_VERSION** (app_info.py): ``$version``",
            "- **Tag**: ``$tag``",
            "- **Trigger**: ``${{ github.event_name }}``",
            "- **Mode**: ``$mode``"
          )
          $summaryLines -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      # Chỉ có ý nghĩa với tag push — tag của workflow_dispatch luôn là tag vừa
      # tính ở trên nên không thể lệch. Fail sớm, trước khi build/publish
      # Release dưới 1 tag không khớp version app tự hiển thị.
      - name: Verify tag matches app_info.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ steps.version.outputs.tag }}") {
            throw "Tag ${{ github.ref_name }} does not match APP_VERSION in app_info.py (expected ${{ steps.version.outputs.tag }}). Bump app_info.py to match before tagging, or fix the tag."
          }

      # APP_RELEASE_DATE rỗng thì verify_license bỏ qua check update_until của
      # license — bắt buộc điền đúng trong app_info.py trước khi build release.
      - name: Verify app_info.py release fields
        run: >-
          python -c "import sys, datetime, app_info;
          datetime.date.fromisoformat(app_info.APP_RELEASE_DATE);
          parts = app_info.APP_VERSION.split('.');
          ok = len(parts) == 3 and all(p.isdigit() for p in parts);
          sys.exit(0 if ok else 'APP_VERSION must be MAJOR.MINOR.PATCH');
          "

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller LocalReaderMonitor.spec --noconfirm

      - name: Verify bundled native dependencies
        shell: pwsh
        run: |
          $internalDir = "dist/LocalReaderMonitor/_internal"
          $cffiBackend = Get-ChildItem `
            -LiteralPath $internalDir `
            -Filter "_cffi_backend*.pyd" `
            -File
          if (-not $cffiBackend) {
            throw "Missing _cffi_backend*.pyd required by PyNaCl."
          }

          $sodiumPath = Join-Path $internalDir "nacl/_sodium.pyd"
          if (-not (Test-Path -LiteralPath $sodiumPath -PathType Leaf)) {
            throw "Missing nacl/_sodium.pyd required by PyNaCl."
          }

      - name: Assemble release package (exe + setup.ps1 side by side)
        shell: pwsh
        run: Copy-Item setup.ps1 dist/LocalReaderMonitor/setup.ps1

      - name: Zip release package
        shell: pwsh
        run: Compress-Archive -Path dist/LocalReaderMonitor/* -DestinationPath LocalReaderMonitor.zip

      # Chỉ cần khi run này KHÔNG publish Release (workflow_dispatch mode
      # artifact) — Release giữ file vĩnh viễn và không tính vào quota Actions
      # storage, upload cả 2 chỉ tốn quota vô ích.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'artifact'
        with:
          name: LocalReaderMonitor
          path: LocalReaderMonitor.zip
          retention-days: 7

      # Chạy cho tag push v*, hoặc workflow_dispatch mode release. Ghi rõ
      # tag_name/target_commitish vì workflow_dispatch không có tag ref để
      # action tự suy ra — dùng tag tính từ app_info.py ở trên.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: LocalReaderMonitor.zip
